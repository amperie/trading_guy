[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-guy"
version = "0.1.0"
description = "Modular event-driven trading framework for backtesting and live trading with Ray Tune HPO and MLflow tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.43.2",
    "mlflow>=3.9.0",
    "mongomock>=4.3.0",
    "optuna>=4.7.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "plotly>=6.5.2",
    "pymongo>=4.16.0",
    "pytest>=9.0.2",
    "ray[default,tune]>=2.54.0",
    "seaborn>=0.13.2",
    "ta-lib>=0.6.8",
    "yfinance>=1.2.0",
]

[tool.setuptools.packages.find]
include = ["trading*"]
