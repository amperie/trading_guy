# Walk-forward backtest with MACD RSI algorithm and periodic HPO re-optimization
#
# Usage:
#   python run.py walk-forward --config configs/example_walk_forward.yaml
#   python run.py walk-forward --config configs/example_walk_forward.yaml --cash 50000
#   python run.py walk-forward --config configs/example_walk_forward.yaml --no-mlflow
#
# How it works:
#   The engine splits the historical data into rolling windows:
#
#     |--- optimize 90d ---|--- trade 30d ---|
#                          |--- optimize 90d ---|--- trade 30d ---|
#                                               |--- optimize 90d ---|--- trade 30d ---|
#
#   At each boundary it runs Ray Tune HPO (50 trials) on the optimization
#   window, compares the best config against the current params, and adopts
#   the new config only if it improves annualized return by >= 5%.
#   The out-of-sample trading window is then backtested with the chosen params.
#
# Requirements:
#   - ray[tune], optuna (pip install "ray[tune]" optuna)
#   - alpaca-py
#   - Alpaca API credentials via accounts.yaml / --account or directly below
#
# MLflow output:
#   - Parent run: "MACD_RSI_WalkForward_aggregate" with mean return, Sharpe, total trades
#   - Nested runs: one per period with per-period metrics, HPO best config, adopted flag

mode: walk-forward

# ---------------------------------------------------------------------------
# Data provider - Alpaca historical bars
# ---------------------------------------------------------------------------
data_provider:
  provider: "trading.data_providers.alpaca_data_provider.AlpacaDataProvider"
  symbols: ["SPY"]
  timeframe: "Minute"
  start_date: "2026-01-01"
  end_date: "2026-03-31"
  adjustment: "split"
  market_hours_only: true
  # api_key / secret_key are filled from the selected account when using --account

# ---------------------------------------------------------------------------
# Algorithm - MACD RSI with default starting parameters
# The walk-forward engine will override these with HPO-optimized values
# ---------------------------------------------------------------------------
algorithm:
  algorithm: "trading.core.algorithms.macd_rsi_algorithm.MacdRsiAlgorithm"
  macd_fastperiod: 12
  macd_slowperiod: 26
  macd_signalperiod: 9
  rsi_period: 14
  extra_history_period: 200

# ---------------------------------------------------------------------------
# Portfolio - single-symbol with bracket orders (stop-loss + profit-taker)
# stop_pct and profit_pct are also tuned by HPO
# ---------------------------------------------------------------------------
portfolio:
  portfolio: "trading.core.pf.single_symbol_portfolio.SingleSymbolPortfolio"
  symbol: "SPY"
  cash: 10000
  keep_history: true
  stop_pct: 5.0
  profit_pct: 10.0

# ---------------------------------------------------------------------------
# Order manager - backtesting (instant fills)
# ---------------------------------------------------------------------------
order_manager:
  order_manager: "trading.core.om.backtesting_om.BacktestingOrderManager"

# ---------------------------------------------------------------------------
# Walk-forward configuration
# ---------------------------------------------------------------------------
walk_forward:
  optimization_window_days: 90
  trading_window_days: 30
  improvement_threshold_pct: 5.0
  num_trials: 50
  max_concurrent_trials: 8

  # Hyperparameter search space explored by Ray Tune + Optuna
  # Supported types: randint, uniform, choice, loguniform
  search_space:
    macd_fastperiod:    { type: randint, low: 5, high: 100 }
    macd_slowperiod:    { type: randint, low: 50, high: 500 }
    macd_signalperiod:  { type: randint, low: 5, high: 100 }
    rsi_period:         { type: randint, low: 5, high: 100 }
    stop_pct:           { type: uniform, low: 1.0, high: 20.0 }
    profit_pct:         { type: uniform, low: 1.0, high: 25.0 }

  algorithm_param_keys:
    - macd_fastperiod
    - macd_slowperiod
    - macd_signalperiod
    - rsi_period
  portfolio_param_keys:
    - stop_pct
    - profit_pct

# ---------------------------------------------------------------------------
# Analysis / MLflow - results are logged per-period as nested runs
# ---------------------------------------------------------------------------
analysis:
  enabled: true
  log_to_mlflow: true
  experiment_name: "MACD RSI Walk-Forward"
  run_name: "MACD_RSI_WalkForward"
  description: "Walk-forward optimization for MACD RSI strategy on SPY Alpaca minute bars"
