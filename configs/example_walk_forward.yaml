# Walk-forward backtest with the promoted volatility-filtered RSI mean-reversion
# algorithm using the new optimize -> validate -> trade flow.
#
# Usage:
#   python run.py walk-forward --config configs/example_walk_forward.yaml
#   python run.py walk-forward --config configs/example_walk_forward.yaml --cash 50000
#   python run.py walk-forward --config configs/example_walk_forward.yaml --no-mlflow
#
# How it works:
#   The engine splits the historical data into rolling windows:
#
#     |--- optimize 90d ---|-- validate 20d --|--- trade 30d ---|
#                                                |--- optimize 90d ---|-- validate 20d --|--- trade 30d ---|
#
#   At each boundary it:
#     1. runs Ray Tune HPO on the optimization window
#     2. evaluates incumbent vs challenger on the SAME validation window
#     3. adopts the challenger only if it clears the configured thresholds
#     4. records that decision as an optimization event
#     5. applies approved changes inside one continuous end-to-end simulation
#
# Requirements:
#   - ray[tune], optuna (pip install "ray[tune]" optuna)
#   - alpaca-py
#   - Alpaca API credentials via accounts.yaml / --account or directly below
#
# MLflow output:
#   - One full walk-forward run with end-to-end metrics from the main portfolio
#   - Equity curve artifacts including optimization/adoption markers
#   - Optimization event tables/JSON for auditability

mode: walk-forward

# ---------------------------------------------------------------------------
# Data provider - Alpaca historical bars
# ---------------------------------------------------------------------------
data_provider:
  provider: "trading.data_providers.alpaca_data_provider.AlpacaDataProvider"
  symbols: ["UPRO"]
  timeframe: "Minute"
  start_date: "2025-01-01"
  end_date: "2026-05-17"
  adjustment: "split"
  market_hours_only: true
  # api_key / secret_key are filled from the selected account when using --account

# ---------------------------------------------------------------------------
# Algorithm - promoted volatility-filtered RSI mean-reversion strategy
# This example now tunes both nested algorithm settings and portfolio exits.
# ---------------------------------------------------------------------------
algorithm:
  algorithm: "VolatilityFilteredRsiMeanReversionAlgorithm"
  source_path: "trading/promoted/volatility_filtered_rsi_mean_reversion_backtest_c5f0894c/VolatilityFilteredRsiMeanReversionAlgorithm.py"
  class_name: "VolatilityFilteredRsiMeanReversionAlgorithm"
  symbol: "UPRO"
  history_length: 260
  regime_detection:
    ma_short_period: 50
    ma_long_period: 200
    ma_proximity_tolerance: 0.02
    atr_period: 14
    atr_percentile_window: 20
    atr_percentile_level: 50
  rsi_config:
    rsi_period: 14
    rsi_oversold_threshold: 30
    rsi_overbought_threshold: 70
  price_confirmation:
    reversal_bar_lookback: 2

# ---------------------------------------------------------------------------
# Portfolio - single-symbol with bracket orders (stop-loss + profit-taker)
# stop_pct and profit_pct are tuned by HPO alongside algorithm parameters
# ---------------------------------------------------------------------------
portfolio:
  portfolio: "trading.core.pf.single_symbol_portfolio.SingleSymbolPortfolio"
  symbol: "UPRO"
  cash: 10000
  keep_history: true
  stop_pct: 5.0
  profit_pct: 10.0

# ---------------------------------------------------------------------------
# Order manager - backtesting (instant fills)
# ---------------------------------------------------------------------------
order_manager:
  order_manager: "trading.core.om.backtesting_om.BacktestingOrderManager"

# ---------------------------------------------------------------------------
# Walk-forward configuration
# These settings drive the new three-window method:
#   optimization_window_days: in-sample tuning window
#   validation_window_days:   incumbent-vs-challenger holdout window
#   trading_window_days:      next out-of-sample window
# ---------------------------------------------------------------------------
walk_forward:
  optimization_window_days: 180
  validation_window_days: 30
  trading_window_days: 30

  # Adoption rule:
  # challenger must improve the objective metric by at least this percent
  # on the validation window.
  improvement_threshold_pct: 5.0

  # Guardrail:
  # reject challengers that produce too few validation trades to be credible.
  min_validation_trades: 5

  # Metric used for incumbent-vs-challenger comparison on validation.
  objective_metric: annualized_return

  num_trials: 50
  max_concurrent_trials: 16
  log_ray_worker_output: true

  # Hyperparameter search space explored by Ray Tune + Optuna.
  # Dotted keys are applied into nested algorithm config blocks.
  # Supported types: randint, uniform, choice, loguniform
  search_space:
    regime_detection.ma_short_period:         { type: randint, low: 20, high: 80 }
    regime_detection.ma_proximity_tolerance:  { type: uniform, low: 0.005, high: 0.05 }
    regime_detection.atr_percentile_level:    { type: randint, low: 30, high: 70 }
    rsi_config.rsi_period:                    { type: randint, low: 5, high: 25 }
    rsi_config.rsi_oversold_threshold:        { type: randint, low: 20, high: 40 }
    rsi_config.rsi_overbought_threshold:      { type: randint, low: 60, high: 80 }
    stop_pct:           { type: uniform, low: 1.0, high: 20.0 }
    profit_pct:         { type: uniform, low: 1.0, high: 15.0 }

  algorithm_param_keys:
    - regime_detection.ma_short_period
    - regime_detection.ma_proximity_tolerance
    - regime_detection.atr_percentile_level
    - rsi_config.rsi_period
    - rsi_config.rsi_oversold_threshold
    - rsi_config.rsi_overbought_threshold
  portfolio_param_keys:
    - stop_pct
    - profit_pct

# ---------------------------------------------------------------------------
# Analysis / MLflow - results are logged as one continuous walk-forward run
# ---------------------------------------------------------------------------
analysis:
  enabled: true
  log_to_mlflow: true
  experiment_name: "walk_forward_runs"
  run_name: "VolatilityFilteredRSIMeanReversion_WalkForward"
  description: "Walk-forward optimization for the promoted volatility-filtered RSI mean-reversion strategy on UPRO Alpaca minute bars"
