# Standalone Ray Tune HPO — SpyTrendMACDAlgorithm + DualSymbolSwitchPortfolio
#
# Usage:
#   python run.py hpo --config configs/example_hpo.yaml
#   python run.py hpo --config configs/example_hpo.yaml --num-samples 50
#   python run.py hpo --config configs/example_hpo.yaml --cash 50000
#   python run.py hpo --config configs/example_hpo.yaml --data data/SPY_UPRO_SPXU_5min.csv --num-samples 10
#
# How it works:
#   Runs Ray Tune with Optuna (Bayesian optimisation) over the full date range
#   of the data file. Each trial backtests one combination of MACD parameters
#   + bracket order percentages and returns the annualized return.
#   The best config is printed at the end and each trial is logged to MLflow.
#
# Requirements:
#   pip install "ray[tune]" optuna

mode: hpo

# ---------------------------------------------------------------------------
# Data provider — historical CSV with SPY, UPRO, and SPXU 5-minute bars
# ---------------------------------------------------------------------------
data_provider:
  provider: "trading.data_providers.test_data_provider.TestDataProvider"
  path: "../data/SPXU_GDXU_UPRO_1min.csv"
  start_date: "01/01/2022"
  truncate: 0  # 0 = use all data

# ---------------------------------------------------------------------------
# Algorithm — MACD-based SPY trend detector
# Static params go here; tunable params come from hpo.search_space below
# ---------------------------------------------------------------------------
algorithm:
  algorithm: "trading.algorithms.spy_trend_macd_algorithm.SpyTrendMACDAlgorithm"
  spy_symbol: "SPY"
  upro_symbol: "UPRO"
  spxu_symbol: "SPXU"
  strength_scale: 20.0  # fixed — not tuned by HPO

# ---------------------------------------------------------------------------
# Portfolio — switches between UPRO (bullish) and SPXU (bearish)
# stop_pct and profit_pct are tuned by HPO (listed in hpo.portfolio_param_keys)
# ---------------------------------------------------------------------------
portfolio:
  portfolio: "trading.core.pf.dual_symbol_switch_portfolio.DualSymbolSwitchPortfolio"
  upro_symbol: "UPRO"
  spxu_symbol: "SPXU"
  cash: 10000
  keep_history: true
  min_signal_strength: 0
  holding_period_hours: 1

# ---------------------------------------------------------------------------
# Order manager — backtesting (instant fills, no real broker)
# ---------------------------------------------------------------------------
order_manager:
  order_manager: "trading.core.om.backtesting_om.BacktestingOrderManager"

# ---------------------------------------------------------------------------
# HPO configuration
# ---------------------------------------------------------------------------
hpo:
  num_samples: 200          # total Ray Tune trials (Optuna Bayesian search)
  max_concurrent_trials: 8  # parallel Ray workers (set to CPU count or less)

  # Search space — parameter ranges explored by Ray Tune + Optuna
  # Supported types: randint, uniform, choice, loguniform
  search_space:
    macd_fast_period:   { type: randint, low: 50,   high: 3000  }
    macd_slow_period:   { type: randint, low: 200,  high: 2000 }
    macd_signal_period: { type: randint, low: 30,   high: 3000  }
    stop_pct:           { type: uniform, low: 1.0, high: 20.0 }
    profit_pct:         { type: uniform, low: 1.0, high: 25.0 }

  # Which search_space keys are routed to the algorithm vs the portfolio
  algorithm_param_keys:
    - macd_fast_period
    - macd_slow_period
    - macd_signal_period

  portfolio_param_keys:
    - stop_pct
    - profit_pct

# ---------------------------------------------------------------------------
# Analysis / MLflow — each trial is logged as a separate run
# ---------------------------------------------------------------------------
analysis:
  log_to_mlflow: true
  experiment_name: "SPY_MACD_HPO"
  run_name: "SPY_MACD_HPO"
  description: "Standalone HPO for SPY MACD trend switching strategy (UPRO/SPXU)"
