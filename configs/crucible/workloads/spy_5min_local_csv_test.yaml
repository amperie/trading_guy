workload:
  name: spy_5min_local_csv_test
  run_name: spy_5min_local_csv_crucible_v1
  description: Local SPY 5-minute CSV crucible smoke/load profile.

data_provider:
  provider: trading.data_providers.test_data_provider.TestDataProvider
  path: ../data/SPY_5min.csv
  start_date: "2021-01-19"
  end_date: "2021-08-31"

order_manager:
  order_manager: trading.core.om.backtesting_om.BacktestingOrderManager

algorithm:
  algorithm: algo_crucible.testing.BuyAndHoldAlgorithm
  evaluation_symbols:
    - SPY
  params:
    history_length: 0
    market_regime:
      enabled: true
      trend_lookback_hours: 12
      baseline_ma_window_hours: 24
      volatility_lookback_hours: 12
      volatility_percentile_window_hours: 48
      drawdown_lookback_hours: 48
      trend_threshold: 0.001
      market_hours_per_day: 6.5
      require_full_windows: false

portfolio:
  portfolio: trading.core.pf.single_symbol_portfolio.SingleSymbolPortfolio
  params:
    cash: 100000
    keep_history: true
    symbol: SPY
    tx_cost: 0.0
    stop_pct: 20.0
    profit_pct: 20.0

fixed_assumptions:
  starting_cash: 100000
  benchmark_symbol: SPY
  transaction_cost: 0.0
  slippage_bps: 0

search_space:
  space:
    stop_pct: {type: uniform, low: 10.0, high: 30.0}
    profit_pct: {type: uniform, low: 10.0, high: 30.0}
  algorithm_param_keys: []
  portfolio_param_keys:
    - stop_pct
    - profit_pct
