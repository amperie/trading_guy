crucible:
  name: default_crucible
  run_name: default_crucible_run
  output_dir: scratch/crucible_runs

logging:
  level: INFO
  structured_events: true
  log_stage_transitions: true
  log_job_lifecycle: true
  log_gate_decisions: true
  log_every_n_completed_jobs: 25
  suppress_per_bar_logs: true
  persist_logs_to_mlflow: true

resume:
  enabled: true
  system_of_record: local
  local_cache_dir: scratch/crucible_runs
  rerun_failed_jobs: true
  reuse_completed_jobs: true

state_store:
  backend: local
  allow_backends:
    - local
    - mlflow
    - mongodb
    - composite

hpo:
  objective:
    metric: composite_v1
    weights:
      annualized_return: 1.0
      max_drawdown_pct: -1.5
      volatility: -0.25
      sortino_ratio: 5.0
      calmar_ratio: 2.0
    gates:
      min_trades: 0
      max_drawdown_pct: 25
    low_trade_penalty: 1000
    drawdown_gate_penalty: 100

gates:
  generalist:
    min_trades: 0
    min_median_oos_return: 0.0
    min_profitable_windows_pct: 0.50
    max_drawdown: 0.25
  specialist:
    min_regime_bars: 5
    min_regime_windows: 2
    min_regime_median_oos_return: 0.0
    min_regime_profitable_windows_pct: 0.60
    max_regime_drawdown: 0.20

plateau:
  max_seeds: 5
  min_seed_distance: 0.15
  neighborhood_radius_pct: 0.10
  max_neighbors_per_seed: 25
  min_neighbor_trials: 3
  min_neighbor_pass_rate: 0.60
  max_peak_to_median_degradation: 0.50

perturbations:
  max_scenarios: 20
  max_required_failures: 0
  min_scenario_pass_rate: 0.80
  scenarios:
    - name: baseline
      required: true
      patch: {}
    - name: cost_slippage_2x
      required: true
      portfolio_param_multipliers:
        tx_cost: 2.0
        transaction_cost: 2.0
        slippage_bps: 2.0

confirmation:
  start_date:
  end_date:
  min_return_pct: 0.0
  max_drawdown_pct: 25.0
  min_trades: 0

promotion:
  create_promoted_folder: false
  output_dir: trading/promoted
