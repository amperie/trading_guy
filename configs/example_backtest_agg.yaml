# Backtest with 1-min SPY data aggregated to N-min bars before the algorithm.
# Change aggregation.aggregation_period_minutes to test different bar sizes.
#
# Usage:
#   python run.py backtest --config configs/example_backtest_agg.yaml
#   python run.py backtest --config configs/example_backtest_agg.yaml --no-mlflow

mode: backtest

data_provider:
  provider: "trading.data_providers.test_data_provider.TestDataProvider"
  path: "../data/SPY_SPXU_UPRO_1min.csv"

algorithm:
  algorithm: "trading.algorithms.spy_trend_macd_algorithm.SpyTrendMACDAlgorithm"
  spy_symbol: "SPY"
  upro_symbol: "UPRO"    # single-symbol mode: trade SPY directly
  spxu_symbol: "SPXU"
  macd_fast_period: 12
  macd_slow_period: 26
  macd_signal_period: 9
  history_length: 200   # enough raw 1-min bars to cover MACD warm-up after aggregation

portfolio:
  portfolio: "trading.core.pf.dual_symbol_switch_portfolio.DualSymbolSwitchPortfolio"
  upro_symbol: "UPRO"
  spxu_symbol: "SPXU"
  cash: 10000
  keep_history: true
  min_signal_strength: 0     # Accept any signal strength (0 = no filter)
  stop_pct: 10              # Stop-loss: exit if price drops 5% from entry
  profit_pct: 10          # Profit-taker: exit if price rises 10% from entry
  holding_period_hours: 0    # Minimum hours to hold before allowing a switch
  tx_cost: 0.0               # Transaction cost per order (0 for commission-free)

order_manager:
  order_manager: "trading.core.om.backtesting_om.BacktestingOrderManager"

# Fold 1-min ticks into 5-min bars before the algorithm sees them.
# Change aggregation_period_minutes (1, 3, 5, 10, 15, ...) to test bar sizes.
aggregation:
  enabled: true
  aggregation_period_minutes: 8
  use_market_open: true
  market_open_hour: 9
  market_open_minute: 30

analysis:
  enabled: true
  log_to_mlflow: true
  experiment_name: "Aggregation Backtest"
  run_name: "SPY 5-min agg"
  benchmarks:
    SPY: "data/SPY_5min.csv"
