[pytest]
# Pytest configuration for trading framework

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Add project root to Python path
pythonpath = .

# Minimum Python version
minversion = 3.8

# Show summary of all test outcomes
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    -v

# Custom markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for complete workflows
    slow: Tests that take significant time to run
    broker: Tests requiring broker connection
    live: Tests requiring live market data
    e2e: End-to-end tests that may require external services

# Coverage options
[coverage:run]
source =
    core
    data_providers
    engines
    algorithms
    utils

omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
# Fail if coverage is below threshold
fail_under = 70

# Show missing lines
show_missing = True

# Exclude lines from coverage
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
