name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -e .

    - name: Run unit tests
      run: |
        pytest \
          tests/unit/test_aggregate_stock_data.py \
          tests/unit/test_indicators.py \
          tests/unit/test_technical_analyzer.py \
          tests/unit/test_ema_function.py \
          tests/unit/test_bracket_order_progression.py \
          tests/unit/test_backtesting_om_deferred_bracket.py \
          tests/unit/test_portfolio.py \
          tests/unit/test_get_price.py \
          tests/unit/test_dual_symbol_switch_portfolio.py \
          tests/unit/test_tick_aggregation_passthrough_engine.py \
          tests/unit/test_trading_state_store.py \
          -v

    - name: Run portfolio analyzer tests
      run: pytest scratch/test_portfolio_analyzer.py -v
