logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  console: true
  file_logging: false
  folder: "logs"
  filename: "trading.log"
  retention_days: 7
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  quiet_loggers:
    - websockets.client
    - pymongo
    - pymongo.connection
    - pymongo.serverSelection

debug_on_sigint: true  # true => Ctrl-C opens the debug REPL instead of interrupting engine-driven runs

mlflow:
  enabled: true
  tracking_uri: "http://hp.lan:8899"
  experiment_name: "Trading Backtest"
  auto_log_system_info: true

pipeline:
  experiment_name: "Trading Pipeline"
  auto_promote_research: true
  gates:
    research:
      min_val_annualized_return: 0
      max_val_max_drawdown_pct: 25
      min_val_total_trades: 5
      min_wf_annualized_return: 0
      max_wf_max_drawdown_pct: 30
    review:
      max_alpaca_live_equity_drift_pct: 5
      max_mongo_live_equity_drift_pct: 5

state_store:
  enabled: true
  connection_uri: "mongodb://hp.lan:27017"
  database: "trading_test"
  session_id: "live_SPY_UPRO_SPXU"  # null = new UUID each run; paste a UUID to resume a session
