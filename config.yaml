logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  console: true
  file_logging: false  # Set to true to enable daily-rotating file output
  folder: "logs"  # Folder for log files
  filename: "trading.log"  # Base filename; date suffix added on rotation
  retention_days: 7  # How many days of log files to keep
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

mlflow:
  enabled: true  # Enable/disable MLflow tracking
  tracking_uri: "http://hp.lan:8899"  # MLflow tracking server URI
  experiment_name: "Trading Backtest"  # Default experiment name
  artifact_location: null  # Custom artifact storage location (null = default)
  run_name_prefix: ""  # Optional prefix for run names
  auto_log_system_info: true  # Automatically log system/environment info

data_provider:
  provider: data_providers.test_data_provider.TestDataProvider
  path: "data/SPXU.csv"
  truncate: 0
simulator:
  data_provider:
    provider: "data_providers.test_data_provider.TestDataProvider"
    path: "data/test_data.csv"
    truncate: 200
  algorithm:
    algorithm: "algorithms.test_algorithm.TestAlgorithm"
    # Algorithm specific configs go here
  order_manager:
    order_manager: "core.order_manager.OrderManager"
    # OM specific config goes here
  portfolio:
    portfolio: "core.portfolio.Portfolio"
    keep_history: true
    # PF specific config here
  alpaca:
    api_key: ""
    secret_key: ""