logging:
  level: INFO
  console: true
  file_logging: false
  folder: logs
  filename: trading.log
  retention_days: 7
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  quiet_loggers:
  - websockets.client
  - pymongo
  - pymongo.connection
  - pymongo.serverSelection
mlflow:
  enabled: true
  tracking_uri: http://hp.lan:8899
  experiment_name: Trading Backtest
  auto_log_system_info: true
state_store:
  enabled: false
  connection_uri: mongodb://hp.lan:27017
  database: trading_test
  session_id: live_SPY_UPRO_SPXU
mode: hpo
data_provider:
  provider: trading.data_providers.alpaca_data_provider.AlpacaDataProvider
  symbols:
  - UPRO
  timeframe: Minute
  start_date: '2020-01-01'
  end_date: '2026-05-17'
  adjustment: split
  market_hours_only: true
  api_key: ''
  secret_key: ''
algorithm:
  algorithm: VolatilityFilteredRsiMeanReversionAlgorithm
  symbol: UPRO
  symbols:
  - UPRO
  tradable_symbols:
  - UPRO
  macro_symbols: []
  regime_detection:
    ma_short_period: 50
    ma_long_period: 200
    ma_proximity_tolerance: 0.02
    atr_period: 14
    atr_percentile_window: 20
    atr_percentile_level: 50
  rsi_config:
    rsi_period: 14
    rsi_oversold_threshold: 30
    rsi_overbought_threshold: 70
  price_confirmation:
    reversal_bar_lookback: 2
  history_length: 260
  source_path: trading/promoted/volatility_filtered_rsi_mean_reversion_backtest_c5f0894c/VolatilityFilteredRsiMeanReversionAlgorithm.py
  class_name: VolatilityFilteredRsiMeanReversionAlgorithm
portfolio:
  portfolio: trading.core.pf.single_symbol_portfolio.SingleSymbolPortfolio
  cash: 100000.0
  keep_history: true
  stop_pct: 1.5
  profit_pct: 2.0
  tx_cost: 1.5
  symbol: UPRO
  source_path: trading/promoted/volatility_filtered_rsi_mean_reversion_backtest_c5f0894c/single_symbol_portfolio.py
  class_name: SingleSymbolPortfolio
order_manager:
  order_manager: trading.core.om.backtesting_om.BacktestingOrderManager
hpo:
  validation_period_days: 60
  objective_metric: val_annualized_return
  num_samples: 100
  max_concurrent_trials: 18
  log_trials_to_mlflow: true
  log_ray_worker_output: true
  search_space:
    regime_detection.ma_short_period:
      type: randint
      low: 20
      high: 80
    regime_detection.ma_proximity_tolerance:
      type: uniform
      low: 0.005
      high: 0.05
    regime_detection.atr_percentile_level:
      type: randint
      low: 30
      high: 70
    rsi_config.rsi_period:
      type: randint
      low: 5
      high: 25
    rsi_config.rsi_oversold_threshold:
      type: randint
      low: 20
      high: 40
    rsi_config.rsi_overbought_threshold:
      type: randint
      low: 60
      high: 80
    stop_pct:
      type: uniform
      low: 1.0
      high: 20.0
    profit_pct:
      type: uniform
      low: 1.0
      high: 15.0
  algorithm_param_keys:
  - regime_detection.ma_short_period
  - regime_detection.ma_proximity_tolerance
  - regime_detection.atr_percentile_level
  - rsi_config.rsi_period
  - rsi_config.rsi_oversold_threshold
  - rsi_config.rsi_overbought_threshold
  portfolio_param_keys:
  - stop_pct
  - profit_pct
analysis:
  log_to_mlflow: true
  experiment_name: hpo_from_mlflow
  run_name: volatility_filtered_rsi_mean_reversion_backtest_c5f0894c_hpo_split
  description: Recreated HPO from source MLflow run 5dc0dce92f504e698ac0a0cdcfb6bee1
    (http://hp.lan:8899/#/experiments/103711891262491636/runs/5dc0dce92f504e698ac0a0cdcfb6bee1)
